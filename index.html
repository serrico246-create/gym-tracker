<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070709">
  <title>Workout Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="bg-glow"></div>

  <div class="app-container">
    <header class="app-header">
      <div>
        <span class="subtitle">SCHEDA ATTIVA</span>
        <h1 id="day-title">Giorno 1</h1>
      </div>
      <button id="reset-day" class="btn-reset" title="Azzera spunte del giorno">Reset</button>
    </header>

    <!-- Selettore Giorni con pillola animata -->
    <nav class="day-tabs" id="day-tabs">
      <button class="tab-btn active" data-day="day1">GG 1</button>
      <button class="tab-btn" data-day="day2">GG 2</button>
      <button class="tab-btn" data-day="day3">GG 3</button>
      <button class="tab-btn" data-day="day4">GG 4</button>
      <div class="tab-indicator" id="tab-indicator"></div>
    </nav>

    <!-- Contenitore dinamico degli esercizi -->
    <main id="exercises-list" class="exercises-container"></main>
  </div>

  <!-- Barra Timer Recupero Flottante -->
  <div id="rest-timer" class="timer-bar hidden">
    <div class="timer-info">
      <span class="timer-dot"></span>
      <span>Recupero: <strong id="timer-display">01:30</strong></span>
    </div>
    <div class="timer-controls">
      <button id="timer-add">+15s</button>
      <button id="timer-skip" class="skip">Salta</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
