<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#161426">
  <title>Workout Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    
    <!-- Header & Tracker Settimanale -->
    <header class="app-header">
      <div>
        <span class="subtitle">SCHEDA ATTIVA</span>
        <h1 id="day-title">Giorno 1</h1>
      </div>
      <div class="header-actions">
        <button id="start-workout" class="btn-start">⚡ Inizia</button>
        <button id="reset-day" class="btn-reset">Reset</button>
      </div>
    </header>

    <!-- Cerchietti Settimanali (L M M G V S D) -->
    <div class="week-tracker">
      <div class="week-day" data-day-index="0"><span>L</span><div class="status-ring"></div></div>
      <div class="week-day" data-day-index="1"><span>M</span><div class="status-ring"></div></div>
      <div class="week-day" data-day-index="2"><span>M</span><div class="status-ring"></div></div>
      <div class="week-day" data-day-index="3"><span>G</span><div class="status-ring"></div></div>
      <div class="week-day" data-day-index="4"><span>V</span><div class="status-ring"></div></div>
      <div class="week-day" data-day-index="5"><span>S</span><div class="status-ring"></div></div>
      <div class="week-day" data-day-index="6"><span>D</span><div class="status-ring"></div></div>
    </div>

    <!-- Selettore Giorni Scheda -->
    <nav class="day-tabs" id="day-tabs">
      <button class="tab-btn active" data-day="day1">GG 1</button>
      <button class="tab-btn" data-day="day2">GG 2</button>
      <button class="tab-btn" data-day="day3">GG 3</button>
      <button class="tab-btn" data-day="day4">GG 4</button>
      <div class="tab-indicator" id="tab-indicator"></div>
    </nav>

    <!-- Barra di Progresso dell'allenamento -->
    <div class="progress-bar-container">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Contenitore Esercizi -->
    <main id="exercises-list" class="exercises-container"></main>
  </div>

  <!-- Barra Timer Recupero Flottante -->
  <div id="rest-timer" class="timer-bar hidden">
    <div class="timer-info">
      <span class="timer-dot"></span>
      <span>Recupero: <strong id="timer-display">01:30</strong></span>
    </div>
    <div class="timer-controls">
      <button id="timer-add">+15s</button>
      <button id="timer-skip" class="skip">Salta</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
